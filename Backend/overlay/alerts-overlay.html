<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamSync — Alertas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none; color: #fff;
    }

    #stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }

    .alert {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      text-align: center; max-width: 80vw;
    }
    .alert-media { max-width: 420px; max-height: 340px; }
    .alert-media img, .alert-media video {
      max-width: 420px; max-height: 340px; object-fit: contain; border-radius: 10px;
      filter: drop-shadow(0 12px 30px rgba(0,0,0,.55));
    }
    .alert-title {
      font-size: 38px; font-weight: 900; line-height: 1.1;
      text-shadow: 0 3px 14px rgba(0,0,0,.7), 0 0 26px var(--accent);
      color: #fff;
    }
    .alert-message {
      font-size: 24px; font-weight: 700; opacity: .95;
      text-shadow: 0 2px 10px rgba(0,0,0,.7);
      color: #ffe;
    }

    /* ---- Animaciones de entrada ---- */
    .anim-pop      { animation: popIn .5s cubic-bezier(.2,1.5,.4,1) both; }
    .anim-slideIn  { animation: slideIn .5s cubic-bezier(.2,1,.3,1) both; }
    .anim-fadeIn   { animation: fadeIn .6s ease both; }
    .anim-bounce   { animation: bounceIn .7s cubic-bezier(.2,1.6,.4,1) both; }
    /* ---- Salida ---- */
    .anim-out      { animation: fadeOut .45s ease forwards; }

    @keyframes popIn   { 0% { opacity: 0; transform: scale(.5); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes slideIn { 0% { opacity: 0; transform: translateY(60px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn  { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes bounceIn{ 0% { opacity: 0; transform: translateY(-80px); } 60% { opacity: 1; transform: translateY(12px);} 100% { transform: translateY(0);} }
    @keyframes fadeOut { 0% { opacity: 1; } 100% { opacity: 0; transform: scale(.94); } }

    #conn {
      position: fixed; bottom: 10px; right: 12px; display: flex; align-items: center; gap: 7px;
      font-size: 11px; color: rgba(255,255,255,.6);
      background: rgba(0,0,0,.4); padding: 5px 10px; border-radius: 999px;
    }
    #conn.hidden { display: none; }
    #conn .dot { width: 9px; height: 9px; border-radius: 50%; background: #f04438; box-shadow: 0 0 8px #f04438; }
    #conn.on .dot { background: #16d680; box-shadow: 0 0 8px #16d680; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="conn"><span class="dot"></span><span id="conn-text">desconectado</span></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
  (function () {
    'use strict';

    const BACKEND_URL = window.location.origin;
    const params = new URLSearchParams(location.search);
    const DEMO = params.get('demo') === '1';
    const CONTROL = params.get('control') === '1';
    const ACCENT = params.get('accent') || '#7c3aed';
    document.documentElement.style.setProperty('--accent', ACCENT);

    const stage = document.getElementById('stage');
    const connEl = document.getElementById('conn');
    const connText = document.getElementById('conn-text');
    if (!CONTROL) connEl.classList.add('hidden');

    const FALLBACK_ICON = { gift: '🎁', follow: '➕', share: '↪️', like: '❤️', subscribe: '⭐', memberJoin: '👋' };

    let mediaByType = {};       // cache de la config (image/sound por tipo)
    let queue = [];
    let busy = false;

    function setConfig(all) { mediaByType = all || {}; }

    // Precarga vía REST (por si el overlay conecta después de configurar).
    fetch(`${BACKEND_URL}/api/alert-media`).then((r) => r.json()).then(setConfig).catch(() => {});

    function enqueue(trigger) {
      queue.push(trigger);
      if (!busy) next();
    }

    function next() {
      if (queue.length === 0) { busy = false; return; }
      busy = true;
      show(queue.shift());
    }

    function show(t) {
      const media = mediaByType[t.type] || {};
      const anim = t.animation || 'pop';
      const duration = Math.max(1500, Number(t.duration) || 5000);
      const vol = typeof t.volume === 'number' ? t.volume
        : (typeof media.soundVolume === 'number' ? media.soundVolume : 0.8);

      const el = document.createElement('div');
      el.className = `alert anim-${anim}`;

      let videoEl = null;

      // Visual: el VIDEO tiene prioridad sobre la imagen/GIF.
      if (media.video) {
        const wrap = document.createElement('div');
        wrap.className = 'alert-media';
        videoEl = document.createElement('video');
        videoEl.src = media.video;
        videoEl.autoplay = true;
        videoEl.loop = !!media.loop;
        videoEl.playsInline = true;
        videoEl.muted = false;
        videoEl.volume = Math.max(0, Math.min(1, vol));
        wrap.appendChild(videoEl);
        el.appendChild(wrap);
      } else if (media.image) {
        const wrap = document.createElement('div');
        wrap.className = 'alert-media';
        const img = document.createElement('img');
        img.src = media.image; img.alt = '';
        wrap.appendChild(img);
        el.appendChild(wrap);
      } else if (!t.title && !t.message) {
        const ic = document.createElement('div');
        ic.className = 'alert-title';
        ic.style.fontSize = '64px';
        ic.textContent = FALLBACK_ICON[t.type] || '🔔';
        el.appendChild(ic);
      }

      if (t.title) {
        const d = document.createElement('div'); d.className = 'alert-title'; d.textContent = t.title; el.appendChild(d);
      }
      if (t.message) {
        const d = document.createElement('div'); d.className = 'alert-message'; d.textContent = t.message; el.appendChild(d);
      }
      stage.appendChild(el);

      // Sonido aparte (cacheado por tipo). Si el video ya trae audio, no subas uno.
      if (media.sound) {
        try {
          const audio = new Audio(media.sound);
          audio.volume = Math.max(0, Math.min(1, vol));
          audio.play().catch(() => {});
        } catch {}
      }

      let done = false;
      const finish = () => {
        if (done) return; done = true;
        el.classList.add('anim-out');
        setTimeout(() => { el.remove(); next(); }, 450);
      };

      if (videoEl && !media.loop) {
        // Video de una sola pasada: termina cuando acaba (con tope de seguridad).
        videoEl.onended = finish;
        setTimeout(finish, 60000);
      } else {
        // Imagen/GIF/texto o video en bucle: dura lo configurado.
        setTimeout(finish, duration);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = String(text || '');
      return div.innerHTML;
    }

    // ---- Socket ----
    if (!DEMO && typeof io !== 'undefined') {
      const socket = io();
      socket.on('connect', () => { connEl.classList.add('on'); connText.textContent = 'conectado'; });
      socket.on('disconnect', () => { connEl.classList.remove('on'); connText.textContent = 'desconectado'; });
      socket.on('alertMediaConfig', setConfig);
      socket.on('alertMedia', enqueue);
    } else {
      connText.textContent = 'modo demo';
      connEl.classList.add('on');
    }

    // ---- Demo ----
    if (DEMO) {
      const types = ['gift', 'follow', 'share', 'subscribe'];
      // En demo no hay media cacheada: usa solo texto + icono fallback.
      let i = 0;
      setInterval(() => {
        const type = types[i++ % types.length];
        enqueue({
          type, animation: ['pop', 'slideIn', 'bounce', 'fadeIn'][i % 4],
          title: { gift: '🎁 ¡Regalo de demo!', follow: '➕ ¡Nuevo seguidor!', share: '↪️ ¡Compartió!', subscribe: '⭐ ¡Nueva suscripción!' }[type],
          message: 'usuario_demo', duration: 4000, volume: 0.6,
        });
      }, 2500);
    }
  })();
  </script>
</body>
</html>
